# Flow Runtime Agent ? Default Configuration
# Override via: system properties > environment variables > config file
#
# Required properties (no defaults ? must be provided):
#   flow.server.url       = http://localhost:8080
#   flow.graph-id         = my-service
#   flow.packages.include = com.mycompany

flow.server.url=http://localhost:8080
flow.server.api-key=
flow.server.connect-timeout-ms=5000
flow.server.read-timeout-ms=5000

flow.graph-id=
flow.service-name=

flow.packages.include=
flow.packages.exclude=

flow.filter.skip-getters-setters=true
flow.filter.skip-constructors=true
flow.filter.skip-private-methods=false
flow.filter.skip-synthetic=true

flow.sampling.rate=1.0

flow.pipeline.buffer-size=8192
flow.pipeline.batch-size=100
flow.pipeline.flush-interval-ms=200

flow.circuit-breaker.failure-threshold=3
flow.circuit-breaker.reset-timeout-ms=30000

flow.graph.auto-publish=true
flow.graph.classpath=META-INF/flow/flow.json
flow.graph.dedup=true

flow.enabled=true

